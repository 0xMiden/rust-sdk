[workspace]
resolver = "2"

members = [
  "bin/integration-tests",
  "bin/miden-bench",
  "bin/miden-cli",
  "crates/rust-client",
  "crates/sqlite-store",
  "crates/testing/miden-client-tests",
  "crates/testing/test-node-genesis",
]

default-members = ["bin/miden-cli", "crates/rust-client"]

[workspace.metadata.inheritance-check]
ignore = [
  # rust-client's wasm32 target needs a sync-only tokio and can't inherit the workspace's rt-multi-thread features.
  { dependency = "tokio", member = "crates/rust-client" },
]

[workspace.package]
authors      = ["miden contributors"]
edition      = "2024"
license      = "MIT"
repository   = "https://github.com/0xMiden/rust-sdk"
rust-version = "1.96"
version      = "0.16.0-rc.2"

[profile.dev]
codegen-units = 16

[profile.test-dev]
inherits  = "dev"
opt-level = 1

[workspace.dependencies]
# Workspace crates
miden-client              = { default-features = false, path = "crates/rust-client", version = "0.16.0-rc.2" }
miden-client-sqlite-store = { default-features = false, path = "crates/sqlite-store", version = "0.16.0-rc.2" }

# Miden protocol dependencies
miden-agglayer  = { default-features = false, version = "0.16.0-rc.6" }
miden-protocol  = { default-features = false, version = "0.16.0-rc.6" }
miden-standards = { default-features = false, version = "0.16.0-rc.6" }
miden-testing   = { default-features = false, version = "0.16.0-rc.6" }
miden-tx        = { default-features = false, version = "0.16.0-rc.6" }
miden-tx-batch  = { default-features = false, version = "0.16.0-rc.6" }

# Miden node dependencies
miden-node-proto-build           = { default-features = false, version = "0.16.0-rc.1" }
miden-note-transport-proto-build = { default-features = false, version = "0.5.0-alpha.1" }

# Miden debug dependency
miden-debug        = { default-features = false, features = ["dap", "std"], version = "0.10" }
miden-mast-package = { default-features = false, version = "0.29" }
miden-processor    = { default-features = false, version = "0.29.1" }

# External dependencies
anyhow             = { default-features = false, version = "1.0" }
assert_cmd         = { version = "2.0" }
async-trait        = { version = "0.1" }
chrono             = { version = "0.4" }
clap               = { version = "4.5" }
comfy-table        = { version = "7.1" }
hex                = { version = "0.4" }
miette             = { features = ["fancy"], version = "7.6" }
predicates         = { version = "3.0" }
prost              = { default-features = false, version = "0.14" }
rand               = { version = "0.10" }
rand_chacha        = { version = "0.10" }
regex              = { version = "1.0" }
rstest             = { version = "0.25" }
serde              = { features = ["derive"], version = "1.0" }
serde_json         = { version = "1.0" }
tempfile           = { version = "3.0" }
thiserror          = { default-features = false, version = "2.0" }
tokio              = { features = ["macros", "rt-multi-thread"], version = "1.48" }
tonic              = { default-features = false, version = "0.14" }
tracing            = { version = "0.1" }
tracing-subscriber = { default-features = false, version = "0.3" }
uuid               = { version = "1.10" }

# TEMPORARY (do not merge): `miden call` needs two things that are not in a published miden-vm
# release yet — the `miden_mast_package::types` re-export it names manifest signature types
# through, and the fix for procedure names in package manifest exports, without which linking a
# compiler-built package panics. Point the whole miden-vm crate set at the revision carrying both;
# patching `mast-package` alone would pull a second `miden-core` and break type unification. Delete
# this entire block once both land in a release — the caret `"0.25"` requirement then picks them up
# from crates.io.
[patch.crates-io]
miden-ace-codegen       = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-air               = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-assembly          = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-assembly-syntax   = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-core              = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-core-lib          = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
# The published `miden-debug` crates are built against the old `miden-core` debug-info API, so they
# fail to compile against the patched `miden-core`; use the local checkout that tracks it.
miden-debug             = { path = "../miden-debug" }
miden-debug-dap         = { path = "../miden-debug/crates/dap" }
miden-debug-engine      = { path = "../miden-debug/crates/engine" }
miden-debug-types       = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-mast-package      = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-package-registry  = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-processor         = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-project           = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-prover            = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-utils-core-derive = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-utils-diagnostics = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-utils-indexing    = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-utils-sync        = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
miden-verifier          = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }
midenc-hir-type         = { git = "https://github.com/walnuthq/miden-vm", rev = "d6230b541f83dbdbb552d173f8253f8d560fa664" }

# Lints are set to warn for development, which are promoted to errors in CI.
[workspace.lints.clippy]
# Pedantic lints are set to a lower priority which allows lints in the group to be selectively enabled.
pedantic = { level = "warn", priority = -1 }
# cast_possible_truncation =   "allow"  # Overly many instances especially regarding indices.
ignored_unit_patterns       = "allow" # Stylistic choice.
missing_errors_doc          = "allow" # TODO: fixup and enable this.
missing_panics_doc          = "allow" # TODO: fixup and enable this.
module_name_repetitions     = "allow" # Many triggers, and is a stylistic choice.
must_use_candidate          = "allow" # This marks many fn's which isn't helpful.
should_panic_without_expect = "allow" # We don't care about the specific panic message.
# End of pedantic lints.
