[package]
authors.workspace      = true
description            = "Protobuf serialization of miden-client types"
edition.workspace      = true
license.workspace      = true
name                   = "miden-client-proto"
publish                = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lib]
crate-type = ["lib"]
doctest    = false

[features]
# Encodes the types that only miden-client defines, such as transaction results and chain anchors.
client = ["dep:miden-client"]
# Encodes the testing types of miden-client, such as the mock note transport node.
testing = ["client", "miden-client/testing"]

[dependencies]
# Miden dependencies
miden-client      = { optional = true, workspace = true }
miden-client-core = { workspace = true }
miden-objects     = { workspace = true }
miden-protocol    = { workspace = true }

# Workspace dependencies
prost     = { features = ["derive", "std"], workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[build-dependencies]
miden-objects = { workspace = true }
prost-build   = { version = "0.14" }
protox        = { workspace = true }

[dev-dependencies]
miden-standards = { features = ["testing"], workspace = true }
