# Comment formatting is handled by `cargo xtask fmt-comments`, which can reflow short comment
# lines instead of only truncating long ones. rustfmt's own comment wrapping is disabled so the
# two tools do not fight; the xtask reads `comment_width` from this file.
comment_width = 100
wrap_comments = false

array_width                    = 80
attr_fn_like_width             = 80
chain_width                    = 80
condense_wildcard_suffixes     = true
edition                        = "2024"
fn_call_width                  = 80
format_code_in_doc_comments    = true
format_macro_matchers          = true
group_imports                  = "StdExternalCrate"
hex_literal_case               = "Lower"
imports_granularity            = "Module"
imports_layout                 = "HorizontalVertical"
match_block_trailing_comma     = true
newline_style                  = "Unix"
single_line_if_else_max_width  = 60
single_line_let_else_max_width = 60
struct_lit_width               = 40
struct_variant_width           = 40
use_field_init_shorthand       = true
use_try_shorthand              = true
