// The subset of the Guardian gRPC API that this crate uses. Field numbers and names must match the
// Guardian service.
syntax = "proto3";

package guardian;

service Guardian {
  // Returns the account state that Guardian holds.
  rpc GetState(GetStateRequest) returns (GetStateResponse);

  // Asks Guardian to prove and submit a signed proposal.
  rpc ExecuteDeltaProposal(ExecuteDeltaProposalRequest) returns (ExecuteDeltaProposalResponse);

  // Returns the latest execution of a proposal.
  rpc GetDeltaProposalExecution(GetDeltaProposalExecutionRequest) returns (GetDeltaProposalExecutionResponse);
}

// ACCOUNT STATE
// ================================================================================================

message GetStateRequest {
  string account_id = 1;
}

message GetStateResponse {
  bool success = 1;
  string message = 2;
  AccountState state = 3;
}

message AccountState {
  string account_id = 1;
  string state_json = 2;
  string commitment = 3;
  string created_at = 4;
  string updated_at = 5;
}

// EXECUTION
// ================================================================================================

message ExecutionError {
  string code = 1;
  string message = 2;
  optional string meta_json = 3;
}

message ExecutionEnvelope {
  string account_id = 1;
  string proposal_id = 2;
  // One of "pending", "proving", "submitted", "committed", "failed".
  string state = 3;
  optional ExecutionError error = 4;
  optional uint64 delta_nonce = 5;
  bool newly_accepted = 6;
  bool proposal_exists = 7;
  uint32 ignored_signatures = 8;
  string updated_at = 9;
}

message ExecuteDeltaProposalRequest {
  string account_id = 1;
  string proposal_id = 2;
  reserved 3;
  reserved "allow_private_note";
}

message ExecuteDeltaProposalResponse {
  ExecutionEnvelope execution = 1;
}

message GetDeltaProposalExecutionRequest {
  string account_id = 1;
  string proposal_id = 2;
}

message GetDeltaProposalExecutionResponse {
  ExecutionEnvelope execution = 1;
}
