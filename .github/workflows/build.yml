name: Build

on:
  push:
    branches: [main, next]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_CACHE_KEY: rust-cache-2026.02.18

jobs:
  build:
    name: Build Client and CLI
    runs-on: warp-ubuntu-latest-arm64-4x
    steps:
      - &update-ca-certificates
        name: Update CA certificates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates
          ubuntu_version="$(awk -F= '$1 == "VERSION_ID" {gsub(/"/, "", $2); print $2}' /etc/os-release)"
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" \
            ge "20260816ubuntu0.${ubuntu_version}.1"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Install Rust toolchain
        run: rustup update --no-self-update
      - name: Add Rust Cache
        uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          shared-key: rust-release-${{ runner.arch }}
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      - name: make - build
        run: make build

  build-wasm:
    name: Build wasm32 (no_std)
    runs-on: warp-ubuntu-latest-arm64-2x
    steps:
      - *update-ca-certificates
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update
          rustup target add wasm32-unknown-unknown
      - name: Add Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-release-${{ runner.arch }}
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: false
      - name: make - build-wasm
        run: make build-wasm

  install:
    name: Install ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [install, install-bench]
    steps:
      - *update-ca-certificates
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Install Rust toolchain
        run: rustup update --no-self-update
      - name: Add Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-release-${{ runner.arch }}
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: false
      - name: make - ${{ matrix.target }}
        run: make ${{ matrix.target }}
