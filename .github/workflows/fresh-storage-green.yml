name: Fresh note retention validation

on:
  push:
    branches: [ci/fresh-rust-storage-green]

permissions:
  contents: read

jobs:
  test:
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/cleanup-runner
      - name: Install Rust
        run: rustup update --no-self-update
      - uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1
        with:
          shared-key: rust-release-${{ runner.arch }}
          prefix-key: rust-cache-2026.02.18
          save-if: false
      - name: Run all note transport tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = dd2678bf564ee1e7be4ed53cbccd2f37732cde3d
          cargo test --locked -p miden-client-unit-tests --lib tests::transport 2>&1 | tee "$RUNNER_TEMP/retention-green.log"
          grep -F 'retention_gate_awaits_host_before_importing_a_note ... ok' "$RUNNER_TEMP/retention-green.log"
          grep -F 'retention_gate_refusal_keeps_transport_cursor_and_retries_note ... ok' "$RUNNER_TEMP/retention-green.log"
      - name: Check the WASM client
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked --target wasm32-unknown-unknown -p miden-client --no-default-features --features tonic
