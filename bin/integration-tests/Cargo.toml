[package]
authors.workspace      = true
description            = "Integration Tests for the miden client library"
edition.workspace      = true
license.workspace      = true
name                   = "miden-client-integration-tests"
publish                = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
# Workspace dependencies
miden-agglayer            = { features = ["std", "testing"], workspace = true }
miden-client              = { features = ["std", "testing", "tonic"], workspace = true }
miden-client-sqlite-store = { workspace = true }
miden-protocol            = { default-features = false, features = ["testing"], workspace = true }

# External dependencies
anyhow         = { features = ["std"], workspace = true }
assert_matches = { version = "1.5.0" }
async-trait    = { workspace = true }
futures        = { workspace = true }
hex            = { workspace = true }
rand           = { workspace = true }
reqwest        = { workspace = true }
serde          = { workspace = true }
serde_json     = { features = ["arbitrary_precision"], workspace = true }
sha2           = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
uuid           = { features = ["v4"], workspace = true }

[lib]
doctest = false
