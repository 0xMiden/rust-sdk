syntax = "proto3";

// Client values of the `settings` table. Field numbers are part of the on-disk format, so a released
// number must keep its meaning. Add fields, do not renumber or reuse them.
package miden.client.store;

import "account.proto";
import "block_number.proto";
import "note.proto";
import "primitives.proto";

// The limits the node reported for its RPC endpoints.
message RpcLimits {
  uint32 note_ids_limit = 1;
  uint32 nullifiers_limit = 2;
  uint32 account_ids_limit = 3;
  uint32 note_tags_limit = 4;
}

// A note fetched from or sent to the note transport network.
message NoteInfo {
  note.NoteHeader header = 1;
  // The note details, which can be encrypted.
  bytes details = 2;
  // The block from which the recipient scans for the note. Absent when the sender gave no hint.
  blockchain.BlockNumber block_hint = 3;
}

// The notes that wait to be relayed to the note transport network.
message RelayOutbox {
  repeated NoteInfo notes = 1;
}

// The note tags whose history the client already fetched from the note transport network.
message NoteTags {
  repeated fixed32 tags = 1;
}

// State of one PSWAP order across the chain of notes that fill it.
message PswapLineageRecord {
  // Handle of the depth-0 note. Stable for the lifetime of the order.
  note.NoteId original_note_id = 1;
  primitives.Felt order_id = 2;
  account.AccountId creator_account_id = 3;
  // Handle of the current tip. Equal to original_note_id at depth 0.
  note.NoteId current_tip_note_id = 4;
  uint32 current_depth = 5;
  uint64 remaining_offered = 6;
  uint64 remaining_requested = 7;
  PswapLineageState state = 8;
}

// Stage an order is at.
enum PswapLineageState {
  // The stage is absent. The store rejects a value with this state.
  PSWAP_LINEAGE_STATE_UNSPECIFIED = 0;
  // The order can still be filled or reclaimed.
  PSWAP_LINEAGE_STATE_ACTIVE = 1;
  PSWAP_LINEAGE_STATE_FULLY_FILLED = 2;
  PSWAP_LINEAGE_STATE_RECLAIMED = 3;
}
