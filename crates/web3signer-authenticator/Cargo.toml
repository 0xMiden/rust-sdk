[package]
authors.workspace      = true
categories             = ["cryptography", "no-std"]
description            = "Transaction authenticator that signs Miden transactions with keys held in a Web3Signer instance"
edition.workspace      = true
keywords               = ["client", "miden", "signer", "web3signer"]
license.workspace      = true
name                   = "miden-web3signer-authenticator"
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[features]
default = ["std"]
# Enables the built-in HTTP transport. The rest of the crate is no_std + alloc, so targets without
# an HTTP client of this kind like wasm32 implement `SignerTransport` themselves.
std = ["dep:reqwest", "hex/std", "thiserror/std"]

[dependencies]
# Miden dependencies
miden-protocol = { workspace = true }
miden-tx       = { workspace = true }

# External dependencies
hex       = { default-features = false, features = ["alloc"], version = "0.4" }
k256      = { default-features = false, features = ["ecdsa"], version = "0.14" }
reqwest   = { default-features = false, features = ["rustls-tls-native-roots"], optional = true, version = "0.12" }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
