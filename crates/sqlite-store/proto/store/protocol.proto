syntax = "proto3";

// Protocol values where the `miden-objects` schema has no message that fits the store. Field numbers
// are part of the on-disk format, so a released number must keep its meaning. Add fields, do not
// renumber or reuse them.
package miden.client.store;

import "asset.proto";
import "block_number.proto";
import "primitives.proto";

// A note inclusion proof. Unlike the `miden-objects` message, it has no note id: a state belongs to
// a note record, which already holds the id.
message NoteInclusionProof {
  blockchain.BlockNumber block_num = 1;
  uint32 note_index_in_block = 2;
  primitives.SparseMerklePath inclusion_path = 3;
}

// The assets of a note. The protocol schema has a message for one asset but not for the list.
message NoteAssets {
  repeated asset.Asset assets = 1;
}

// The peaks of the partial blockchain MMR. The message has no forest: the checkpoint row keeps it
// as the block number.
message MmrPeaks {
  repeated primitives.Word peaks = 1;
}

// A MAST forest in the Miden binary format with its node hashes. The store reads the forest without
// a new hash check, so the hashes must be present. The `miden-objects` message can omit them.
message MastForest {
  bytes encoded = 1;
}

message AccountCode {
  MastForest mast = 1;
  repeated primitives.Word procedure_roots = 2;
}

message NoteScript {
  MastForest mast = 1;
  uint32 entrypoint = 2;
}

message TransactionScript {
  MastForest mast = 1;
  uint32 entrypoint = 2;
}
