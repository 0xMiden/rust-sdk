# Checks that already released SQL migrations are not edited.
# Lives in its own workflow so that adding or removing the "no migration check" label re-evaluates
# the check without re-running the whole lint suite.

name: migrations

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

# Node actions must use the updated system CA bundle.
env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  migrations:
    name: Migrations are append-only
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Update CA certificates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates
          ubuntu_version="$(awk -F= '$1 == "VERSION_ID" {gsub(/"/, "", $2); print $2}' /etc/os-release)"
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" \
            ge "20260816ubuntu0.${ubuntu_version}.1"
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check that no released migration was modified
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          NO_MIGRATION_CHECK_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no migration check') }}
        run: ./scripts/check-migrations.sh
        shell: bash
