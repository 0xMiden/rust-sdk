[package]
authors.workspace      = true
description            = "Default gRPC clients for the Miden node, the note transport service and the remote prover"
edition.workspace      = true
license.workspace      = true
name                   = "miden-client-grpc"
publish                = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[package.metadata.cargo-shear]
# "tonic-prost" is used by the generated proto bindings, which shear does not resolve.
ignored = ["tonic-prost"]

[lib]
crate-type = ["lib"]

[features]
default = ["std"]
std = [
  "dep:tokio",
  "miden-client-core/std",
  "miden-objects/std",
  "miden-protocol/std",
  "miden-tx/std",
  "tonic/tls-native-roots",
  "tonic/tls-ring",
  "tonic/transport",
]

[dependencies]
# Miden dependencies
miden-client-core = { workspace = true }
miden-objects     = { workspace = true }
miden-protocol    = { workspace = true }
miden-tx          = { workspace = true }

# External dependencies
async-trait  = { workspace = true }
futures      = { workspace = true }
prost        = { features = ["derive"], workspace = true }
thiserror    = { workspace = true }
tokio        = { features = ["sync", "time"], optional = true, workspace = true }
tonic        = { features = ["codegen"], workspace = true }
tonic-health = { workspace = true }
tonic-prost  = { workspace = true }
tracing      = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers           = { workspace = true }
tokio                 = { default-features = false, features = ["sync"], version = "1.48" }
tonic-web-wasm-client = { workspace = true }

[build-dependencies]
miden-node-proto-build = { workspace = true }
miden-objects          = { workspace = true }
miette                 = { workspace = true }
tonic-prost-build      = { workspace = true }

[dev-dependencies]
miden-protocol  = { default-features = false, features = ["testing"], workspace = true }
miden-standards = { workspace = true }
miden-testing   = { default-features = false, workspace = true }
tokio           = { workspace = true }

[lints]
workspace = true
