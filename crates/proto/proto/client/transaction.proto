syntax = "proto3";

// Transaction values. Field numbers are part of the encoded format, so a released number must keep
// its meaning. Add fields, do not renumber or reuse them.
package client.transaction;

import "account.proto";
import "block_number.proto";
import "note.proto";
import "primitives.proto";
import "transaction.proto";
import "transaction_inputs.proto";

// Status of a transaction the client tracks.
message TransactionStatus {
  // The transaction is submitted and is not committed yet.
  message Pending {}

  // The transaction is in the chain.
  message Committed {
    // Number of the block that contains the transaction.
    blockchain.BlockNumber block_number = 1;
    // Time at which the block was committed, in seconds since the Unix epoch.
    uint64 commit_timestamp = 2;
  }

  // The transaction can never commit.
  message Discarded {
    DiscardCause cause = 1;
  }

  oneof status {
    Pending pending = 1;
    Committed committed = 2;
    Discarded discarded = 3;
  }
}

// Reason for which a transaction was discarded.
enum DiscardCause {
  // The reason is absent. Decoding rejects a value with this cause.
  DISCARD_CAUSE_UNSPECIFIED = 0;
  DISCARD_CAUSE_EXPIRED = 1;
  DISCARD_CAUSE_INPUT_CONSUMED = 2;
  DISCARD_CAUSE_DISCARDED_INITIAL_STATE = 3;
  DISCARD_CAUSE_STALE = 4;
  DISCARD_CAUSE_SUPERSEDED = 5;
}

// Facts about a transaction the client executed.
message TransactionDetails {
  account.AccountId account_id = 1;
  primitives.Word init_account_state = 2;
  primitives.Word final_account_state = 3;
  repeated primitives.Word input_note_nullifiers = 4;
  .transaction.RawOutputNotes output_notes = 5;
  blockchain.BlockNumber block_num = 6;
  blockchain.BlockNumber submission_height = 7;
  blockchain.BlockNumber expiration_block_num = 8;
  // Time at which the client created the transaction, in seconds since the Unix epoch.
  uint64 creation_timestamp = 9;
}

// A transaction that an account can execute.
message TransactionRequest {
  repeated blockchain.BlockNumber block_numbers = 1;
  repeated note.Note input_notes = 2;
  repeated NoteArgsEntry input_notes_args = 3;
  repeated .transaction.InputNote explicit_input_notes = 4;
  TransactionScriptTemplate script_template = 5;
  repeated note.NoteRecipient expected_output_recipients = 6;
  repeated ExpectedFutureNote expected_future_notes = 7;
  primitives.AdviceMap advice_map = 8;
  primitives.MerkleStore merkle_store = 9;
  repeated ForeignAccount foreign_accounts = 10;
  optional uint32 expiration_delta = 11;
  bool ignore_invalid_input_notes = 12;
  // Word that the transaction script receives on the operand stack.
  primitives.Word script_arg = 13;
  // Word that the authentication procedure receives on the operand stack.
  primitives.Word auth_arg = 14;
  primitives.Word fee_conversion_salt = 15;
  repeated note.NoteScript expected_ntx_scripts = 16;
}

// Arguments of one input note.
message NoteArgsEntry {
  note.NoteId note_id = 1;
  // An absent value means that the note has no arguments.
  primitives.Word note_args = 2;
}

// Template from which the client builds the transaction script.
message TransactionScriptTemplate {
  // Notes that the transaction script must create.
  message SendNotes {
    repeated note.PartialNote notes = 1;
  }

  oneof template {
    // The exact transaction script to execute.
    .transaction.TransactionScript custom_script = 1;
    SendNotes send_notes = 2;
  }
}

// A note that a later transaction is expected to create.
message ExpectedFutureNote {
  note.NoteDetails details = 1;
  fixed32 tag = 2;
}

// An account that is not the executing account and that the transaction reads.
message ForeignAccount {
  message Public {
    account.AccountId account_id = 1;
    AccountStorageRequirements storage_requirements = 2;
  }

  oneof account {
    Public public = 1;
    account.PartialAccount private = 2;
  }
}

// Storage map entries that the client gets for a public foreign account.
message AccountStorageRequirements {
  // Map keys of one storage slot. An empty key list means all entries of the slot.
  message SlotKeys {
    string slot_name = 1;
    repeated primitives.Word keys = 2;
  }

  repeated SlotKeys slots = 1;
}
