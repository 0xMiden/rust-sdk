[package]
authors.workspace      = true
description            = "Core traits and types shared by the miden-client crates"
edition.workspace      = true
license.workspace      = true
name                   = "miden-client-core"
publish                = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lib]
crate-type = ["lib"]
doctest    = false

[features]
default = ["std"]
std     = ["miden-objects/std", "miden-protocol/std", "miden-standards/std"]
testing = ["miden-standards/testing"]

[dependencies]
# Miden dependencies
miden-objects   = { workspace = true }
miden-protocol  = { workspace = true }
miden-standards = { workspace = true }

# External dependencies
async-trait = { workspace = true }
chrono      = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
miden-protocol  = { default-features = false, features = ["testing"], workspace = true }
miden-standards = { features = ["testing"], workspace = true }
miden-testing   = { default-features = false, workspace = true }
rand            = { workspace = true }
rand_chacha     = { workspace = true }
tokio           = { workspace = true }

[lints]
workspace = true
