name: Test

permissions:
  contents: read

on:
  push:
    branches: [main, next]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "docs/**"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_CACHE_KEY: rust-cache-2026.02.18

jobs:
  changes:
    name: Select system tests
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      agglayer: ${{ steps.filter.outputs.agglayer }}
      integration: ${{ steps.filter.outputs.integration }}
      miden-bench: ${{ steps.filter.outputs.miden-bench }}
      test-node: ${{ steps.filter.outputs.test-node }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test system-test selector
        run: .github/scripts/test-select-system-tests.sh
      - name: Select tests for changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/select-system-tests-from-git.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA"

  test:
    name: Unit tests
    runs-on: warp-ubuntu-latest-x64-8x
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Install Rust
        run: rustup update --no-self-update
      - name: Add Rust Cache
        uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          shared-key: rust-release-${{ runner.arch }}
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
      # Keep this on a released install-action commit with an explicit tool; shortcut tags can
      # trip zizmor's impostor-commit audit when they are later retagged.
      - uses: taiki-e/install-action@055f5df8c3f65ea01cd41e9dc855becd88953486 # v2.75.18
        with:
          tool: nextest@0.9.122
      - name: make - test
        run: make test

  doc-tests:
    name: Documentation tests
    runs-on: warp-ubuntu-latest-arm64-2x
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Install rust
        run: rustup update --no-self-update
      - name: Add Rust Cache
        uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          shared-key: rust-release-${{ runner.arch }}
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: false
      - name: Run doc-tests
        run: make test-docs

  build-test-node:
    name: Restore test node cache
    runs-on: warp-ubuntu-latest-x64-2x
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.test-node != 'false' }}
    outputs:
      cache-hit: ${{ steps.cache-test-node.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Resolve node revision
        id: node-rev
        run: |
          rev=$(./scripts/start-test-node.sh --print-rev)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: Restore test node binaries
        id: cache-test-node
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/test-node/install
          key: ${{ runner.os }}-${{ runner.arch }}-test-node-with-ntl-${{ steps.node-rev.outputs.rev }}
      - name: Check binary existence
        if: steps.cache-test-node.outputs.cache-hit == 'true'
        run: file -E target/test-node/install/bin/miden-validator target/test-node/install/bin/miden-note-transport
      - name: Upload test node binaries
        if: steps.cache-test-node.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-node-artifact
          # `.crates.toml` is hidden and records the installed rev; the consumer jobs read it to
          # confirm the cached binaries match the pinned rev, so it must be uploaded.
          include-hidden-files: true
          path: target/test-node/install

  install-test-node:
    name: Build test node
    runs-on: warp-ubuntu-latest-x64-8x
    needs: [changes, build-test-node]
    if: ${{ !cancelled() && needs.changes.outputs.test-node != 'false' && (needs.build-test-node.result != 'success' || needs.build-test-node.outputs.cache-hit != 'true') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Resolve node revision
        id: node-rev
        run: |
          rev=$(./scripts/start-test-node.sh --print-rev)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      # Build dir cached per node rev, with no cross-rev fallback: cargo reuses stale build-script
      # outputs when one target dir serves the same crate versions from two git revs, which breaks
      # the compile with phantom type errors. A rev bump therefore compiles from scratch.
      - name: Restore test node build cache
        id: cache-test-node-build
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/test-node/build
          key: ${{ runner.os }}-${{ runner.arch }}-test-node-build-${{ steps.node-rev.outputs.rev }}
      - name: Install Rust
        run: rustup update --no-self-update
      - name: Build node binaries
        run: ./scripts/start-test-node.sh --install-only
      - name: Check binary existence
        run: file -E target/test-node/install/bin/miden-validator target/test-node/install/bin/miden-note-transport
      # Saved on every branch (not just `next`) so a PR's later pushes reuse its first build instead
      # of recompiling the node from scratch each push. Keyed on the node rev.
      - name: Save test node build cache
        if: steps.cache-test-node-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/test-node/build
          key: ${{ runner.os }}-${{ runner.arch }}-test-node-build-${{ steps.node-rev.outputs.rev }}
      - name: Save test node binaries
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/test-node/install
          key: ${{ runner.os }}-${{ runner.arch }}-test-node-with-ntl-${{ steps.node-rev.outputs.rev }}
      - name: Upload test node binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-node-artifact
          include-hidden-files: true
          overwrite: true
          path: target/test-node/install

  miden-bench:
    name: miden-bench smoke tests
    runs-on: warp-ubuntu-latest-x64-8x
    needs: [changes, build-test-node, install-test-node]
    if: ${{ !cancelled() && needs.changes.outputs.miden-bench != 'false' && (needs.install-test-node.result == 'success' || (needs.build-test-node.result == 'success' && needs.build-test-node.outputs.cache-hit == 'true' && needs.install-test-node.result == 'skipped')) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Install Rust
        run: rustup update --no-self-update
      # Keep this on a released install-action commit with an explicit tool; shortcut tags can
      # trip zizmor's impostor-commit audit when they are later retagged.
      - uses: taiki-e/install-action@055f5df8c3f65ea01cd41e9dc855becd88953486 # v2.75.18
        with:
          tool: nextest@0.9.122
      - name: Add Rust Cache
        uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          shared-key: rust-release-${{ runner.arch }}
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: false
      - name: Run miden-bench CLI tests
        run: make test-miden-bench
      - name: Run the SQL store scaling benchmark
        run: make bench-store
      - name: Fetch test node binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-node-artifact
          path: target/test-node/install
      - name: Restore test node permissions
        run: chmod +x target/test-node/install/bin/*
      - name: Start test node
        run: make start-node-background
      - name: Run miden-bench smoke tests
        run: make integration-test-miden-bench
      - name: Stop test node
        if: always()
        run: make stop-node

  agglayer-tests:
    name: AggLayer tests
    runs-on: warp-ubuntu-latest-x64-8x
    needs: [changes, build-test-node, install-test-node]
    if: ${{ !cancelled() && needs.changes.outputs.agglayer != 'false' && (needs.install-test-node.result == 'success' || (needs.build-test-node.result == 'success' && needs.build-test-node.outputs.cache-hit == 'true' && needs.install-test-node.result == 'skipped')) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Install Rust
        run: rustup update --no-self-update
      - uses: taiki-e/install-action@055f5df8c3f65ea01cd41e9dc855becd88953486 # v2.75.18
        with:
          tool: nextest@0.9.122
      - name: Add Rust Cache
        uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          shared-key: rust-release-${{ runner.arch }}
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: false
      - name: Fetch test node binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-node-artifact
          path: target/test-node/install
      - name: Restore test node permissions
        run: chmod +x target/test-node/install/bin/*
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - name: Start test node
        run: make start-node-background
      - name: Run agglayer tests
        run: make integration-test-agglayer
      - name: Stop test node
        if: always()
        run: make stop-node
      - name: Upload node logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agglayer-node-logs
          path: target/test-node/data/logs
          if-no-files-found: warn
          retention-days: 7

  allowlist-tests:
    name: Account allowlist tests
    runs-on: warp-ubuntu-latest-x64-8x
    needs: [changes, build-test-node, install-test-node]
    if: ${{ !cancelled() && needs.changes.outputs.integration != 'false' && (needs.install-test-node.result == 'success' || (needs.build-test-node.result == 'success' && needs.build-test-node.outputs.cache-hit == 'true' && needs.install-test-node.result == 'skipped')) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Install Rust
        run: rustup update --no-self-update
      - uses: taiki-e/install-action@055f5df8c3f65ea01cd41e9dc855becd88953486 # v2.75.18
        with:
          tool: nextest@0.9.122
      - name: Add Rust Cache
        uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          shared-key: rust-release-${{ runner.arch }}
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: false
      - name: Fetch test node binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-node-artifact
          path: target/test-node/install
      - name: Restore test node permissions
        run: chmod +x target/test-node/install/bin/*
      # This node enforces the account allowlist, which rejects the account creations every other
      # integration test does, so it serves these tests alone. Starting it also binds the
      # administration API the tests create their invitation codes through, and starts the funding
      # service that pays each account which registers.
      - name: Start test node with the account allowlist enforced
        run: make start-node-background
        env:
          MIDEN_ACCOUNT_ALLOWLIST: "1"
      - name: Run account allowlist tests
        run: make integration-test-allowlist
      - name: Stop test node
        if: always()
        run: make stop-node
      - name: Upload node logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allowlist-node-logs
          path: target/test-node/data/logs
          if-no-files-found: warn
          retention-days: 7

  integration-tests:
    name: Integration tests
    runs-on: warp-ubuntu-latest-x64-8x
    needs: [changes, build-test-node, install-test-node]
    if: ${{ !cancelled() && needs.changes.outputs.integration != 'false' && (needs.install-test-node.result == 'success' || (needs.build-test-node.result == 'success' && needs.build-test-node.outputs.cache-hit == 'true' && needs.install-test-node.result == 'skipped')) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Cleanup large tools for build space
        uses: ./.github/actions/cleanup-runner
      - name: Install Rust
        run: rustup update --no-self-update
      # Keep this on a released install-action commit with an explicit tool; shortcut tags can
      # trip zizmor's impostor-commit audit when they are later retagged.
      - uses: taiki-e/install-action@055f5df8c3f65ea01cd41e9dc855becd88953486 # v2.75.18
        with:
          tool: nextest@0.9.122
      - name: Add Rust Cache
        uses: WarpBuilds/rust-cache@9d0cc3090d9c87de74ea67617b246e978735b1a1 # v2.9.1
        with:
          shared-key: rust-release-${{ runner.arch }}
          prefix-key: ${{ env.RUST_CACHE_KEY }}
          save-if: false
      - name: Fetch test node binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-node-artifact
          path: target/test-node/install
      - name: Restore test node permissions
        run: chmod +x target/test-node/install/bin/*
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      # The test node now runs its own transaction prover (miden-remote-prover) for the ntx-builder;
      # see scripts/start-test-node.sh.
      - name: Start test node
        run: make start-node-background
      - name: Start note transport
        run: make start-note-transport-background
      - name: Run non-agglayer integration tests
        run: make integration-test-non-agglayer
      - name: Stop test node
        if: always()
        run: make stop-node
      # A failing test reports only what the client saw; the node's own logs are what say why it
      # refused a transaction or never built one.
      - name: Upload node logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-logs
          path: target/test-node/data/logs
          if-no-files-found: warn
          retention-days: 7
      - name: Stop note transport
        if: always()
        run: make stop-note-transport
