[package]
authors.workspace      = true
description            = "SQLite-backed Store implementation for miden-client"
edition.workspace      = true
license.workspace      = true
name                   = "miden-client-sqlite-store"
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lib]
crate-type = ["lib"]
doctest    = false

[dependencies]
# Miden dependencies
miden-client       = { workspace = true }
miden-client-proto = { workspace = true }
# The account forest is persisted as `Subtree`s, which `miden-crypto` only builds with `concurrent`.
# On native targets `miden-client/std` already enables it; on `wasm32` this is what does.
miden-protocol = { features = ["std"], workspace = true }

# Workspace dependencies
anyhow      = { workspace = true }
async-trait = { workspace = true }
chrono      = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }

# External dependencies
rusqlite           = { features = ["array", "bundled", "fallible_uint", "vtab"], version = "0.41" }
rusqlite_migration = { version = "2.7" }

# The connection pool runs each query on a blocking thread, which `wasm32` does not have. There the
# store drives a single connection inline, and `miden-client` is built without `std`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
deadpool      = { default-features = false, features = ["managed", "rt_tokio_1"], version = "0.12" }
deadpool-sync = { version = "0.1" }
miden-client  = { features = ["std"], workspace = true }
tokio         = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# Enable client testing utilities only for tests
miden-client    = { features = ["testing"], workspace = true }
miden-standards = { features = ["testing"], workspace = true }
