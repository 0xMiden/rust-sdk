[profile.default]
fail-fast      = false
failure-output = "immediate-final"
retries        = { backoff = "exponential", count = 2, delay = "1s", jitter = true, max-delay = "10s" }
slow-timeout   = { period = "3m", terminate-after = 2 }
status-level   = "skip"

# The integration tests all share a node instance, so concurrency is capped to bound the
# pressure on it. Every test also proves its transactions locally, so this doubles as the cap on
# concurrent provers; raising it past the runner's core count trades node contention for CPU
# contention and slows the suite down instead.
[test-groups.integration]
max-threads = 4

[[profile.default.overrides]]
filter           = "package(miden-client-unit-tests)"
threads-required = 3

[[profile.default.overrides]]
filter     = "binary(integration)"
test-group = "integration"

[[profile.default.overrides]]
filter  = "test(import_genesis_accounts_can_be_used_for_transactions)"
retries = 0
